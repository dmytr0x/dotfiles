"$schema" = "https://starship.rs/config-schema.json"

format = """
$hostname\
$time\
$python\
$nodejs\
$golang\
$rust\
$aws\
$docker_context\
$line_break\
$directory\
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_status\
$jobs\
$cmd_duration\
$line_break\
$character"""

palette = "dmytr0x"

add_newline = true
scan_timeout = 100
command_timeout = 500
follow_symlinks = false

[hostname]
ssh_only = false
style = "mauve"
format = "[$hostname]($style)"

[time]
disabled = false
time_format = "%R"
format = "[[  $time ](fg:yellow)]($style)"

[directory]
style = "light_blue"
format = "[$path ]($style)"
truncation_length = 5
truncation_symbol = "…/"
truncate_to_repo = false

[fill]
symbol = " "

[python]
style = "teal"
symbol = " "
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'

[lua]
symbol = " "

[nodejs]
style = "blue"
symbol = " "

[golang]
style = "blue"
symbol = " "

[rust]
style = "peach"
symbol = " "

[aws]
symbol = " "
style = "yellow"
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = " "
style = "teal"
format = "[$symbol]($style) $path"
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_extensions = ["Dockerfile"]

[jobs]
symbol = " "
style = "red"
number_threshold = 1
format = "[$symbol]($style)"

[cmd_duration]
min_time = 500
style = "fg:gray"
format = "[$duration]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL"
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
format = "$output"
require_repo = true
ignore_timeout = true

[git_branch]
style = "fg:white bg:dark_gray"
format = " [[](dark_gray) $branch ]($style)[](dark_gray)"

[git_status]
format = "[$staged$modified$deleted$renamed$conflicted$ahead_behind]($style)"
# options available for format
staged = "[✓${count} ](green)"
modified = "[!${count} ](yellow)"
renamed = "[»${count} ](blue)"
deleted = "[-${count} ](red)"
untracked = "[?${count} ](purple)"
stashed = "[≡${count} ](gray)"
conflicted = "[✖${count} ](red bold)"

ahead = "[⇡${count} ](teal)"
behind = "[⇣${count} ](tan)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count} ](purple)"

[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
      common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
      git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
      if [ "$common_dir" != "$git_dir" ]; then
            echo "⛓ "
      fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = " ([$output ]($style))"
style = "bold green"
require_repo = true
ignore_timeout = true

[palettes.dmytr0x]
# Color names describe the dmytr0x theme colors they represent.
dark_gray = "#161616"
gray = "#9D9D9D"
red = "#F14C4C"
yellow = "#CCA700"
green = "#4FE764"
blue = "#569CD6"
bright_blue = "#3794FF"
light_blue = "#4DAAFC"
teal = "#4EC9B0"
peach = "#CE9178"
tan = "#D7BA7D"
purple = "#C586C0"
# Additional colors
mauve = "#cba6f7"
white = "#cccccc"
