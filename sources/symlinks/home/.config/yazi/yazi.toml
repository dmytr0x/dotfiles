# Source: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [2, 5, 3]
sort_by = "natural"
sort_reverse = false
show_hidden = true

[opener]
edit = [
  { run = '${EDITOR:-vi} %s', desc = "Editor", block = true, for = "unix" },
  { run = 'zed --new %s', desc = "Open in Zed", for = "unix" },
]
open = [{ run = "open %s", desc = "Open", for = "macos" }]
reveal = [
  { run = "open -R %s1", desc = "Reveal", for = "macos" },
  { run = "exiftool %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = "ya pub extract --list %s", desc = "Extract here", for = "unix" },
]
play = [
  { run = "open %s", orphan = true, desc = "Play", for = "macos" },
  { run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.zip", use = "extract" },
  { url = "*.7z",  use = "extract" },
  { url = "*.rar", use = "extract" },
]

[plugin]
prepend_previewers = [
  { mime = "application/pdf", run = "noop" },
]
prepend_preloaders = [
  { mime = "application/pdf", run = "noop" },
]

# git.yazi fetchers. Yazi >= 26.1.22 uses `url`/`group` and does not need `id`.
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# Disable all preloaders
#  https://yazi-rs.github.io/docs/configuration/yazi/#plugin.preloaders
#  preloaders = [{ mime = "*", run = "noop" }]
