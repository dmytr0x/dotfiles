#:schema https://yazi-rs.github.io/schemas/keymap.json

# Cursor movement is inverted-T on QWERTY: j left, k down, i up, l right.
# Shifted variants follow the same layout (J back, K/I preview seek, L forward).
# Old vim keys (h/H) are unbound so they no longer also move.

[mgr]
prepend_keymap = [
  { on = "j", run = "leave", desc = "Back to the parent directory" },
  { on = "k", run = "arrow next", desc = "Next file" },
  { on = "i", run = "arrow prev", desc = "Previous file" },
  { on = "l", run = "enter", desc = "Enter the child directory" },
  { on = "J", run = "back", desc = "Back to previous directory" },
  { on = "K", run = "seek 5", desc = "Seek down 5 units in the preview" },
  { on = "I", run = "seek -5", desc = "Seek up 5 units in the preview" },
  { on = "L", run = "forward", desc = "Forward to next directory" },
  { on = "h", run = "noop" },
  { on = "H", run = "noop" },
  #
  # Go to
  { on = [ "g", "m" ], run = "cd ~/Mega", desc = "Go to Mega" },
  #
  # Shell
  { on = "<C-;>", run = 'shell "$SHELL" --block --confirm', desc = "Open shell here" },
  #
  # === Plugins ===
  #
  # Git changes
  # https://github.com/yazi-rs/plugins/tree/main/vcs-files.yazi
  { on = [ "\\", "g" ], run = "plugin vcs-files", desc = "Show Git file changes" },
  { on = [ "\\", "l" ], run = 'shell "lazygit" --block', desc = "Open LazyGit" },
  #
  # Mount manager
  # https://github.com/yazi-rs/plugins/tree/main/mount.yazi
  { on = [ "\\", "m" ], run = "plugin mount", desc = "Mount manager" },
  #
  # Toggle pane
  #
  { on = [ "\\", "p" ], run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
  #
  # Archive selected files
  #
  { on = [ "\\", "a", "z" ], run = "plugin compress zip", desc = "Create a zip" },
  { on = [ "\\", "a", "7" ], run = "plugin compress 7z", desc = "Create a 7z" },
  { on = [ "\\", "a", "t" ], run = "plugin compress tar", desc = "Create a tar" },
  { on = [ "\\", "a", "g" ], run = "plugin compress tar.gz", desc = "Create a tar.gz" },
  #

]

[tasks]
prepend_keymap = [
  { on = "i", run = "arrow prev", desc = "Previous task" },
  { on = "k", run = "arrow next", desc = "Next task" },
  { on = "j", run = "noop" },
]

[spot]
prepend_keymap = [
  { on = "i", run = "arrow prev", desc = "Previous line" },
  { on = "k", run = "arrow next", desc = "Next line" },
  { on = "j", run = "swipe prev", desc = "Swipe to previous file" },
  { on = "l", run = "swipe next", desc = "Swipe to next file" },
  { on = "h", run = "noop" },
]

[pick]
prepend_keymap = [
  { on = "i", run = "arrow prev", desc = "Previous option" },
  { on = "k", run = "arrow next", desc = "Next option" },
  { on = "j", run = "noop" },
]

[input]
prepend_keymap = [
  { on = "j", run = "move -1", desc = "Move back a character" },
  { on = "l", run = "move 1", desc = "Move forward a character" },
  { on = "i", run = "recall -1", desc = "Recall previous input" },
  { on = "k", run = "recall 1", desc = "Recall next input" },
  { on = "h", run = "insert", desc = "Enter insert mode" },
  { on = "H", run = [ "move first-char", "insert" ], desc = "Move to the BOL, and enter insert mode" },
]

[confirm]
prepend_keymap = [
  { on = "i", run = "arrow prev", desc = "Previous line" },
  { on = "k", run = "arrow next", desc = "Next line" },
  { on = "j", run = "noop" },
]

[help]
prepend_keymap = [
  { on = "i", run = "arrow prev", desc = "Previous line" },
  { on = "k", run = "arrow next", desc = "Next line" },
  { on = "j", run = "noop" },
]
