# Minimal Ghostty Overlay
# The standard Ghostty configuration is loaded first.
# This file then overrides its keybindings with a concise set of application-oriented shortcuts.

working-directory = home

# Remove Ghostty's built-in and user-defined keybindings for this instance.
keybind = clear

# Ghostty-owned application/window operations.
keybind = cmd+q=quit

# Keep Ghostty's default command palette shortcut.
keybind = cmd+shift+p=toggle_command_palette

# Host terminal font size.
keybind = cmd+-=decrease_font_size:1
keybind = cmd+==increase_font_size:1
keybind = cmd++=increase_font_size:1
keybind = cmd+0=reset_font_size

# Clipboard behavior:
# - Cmd+C copies a Ghostty selection when present; otherwise it reaches the application.
# - Cmd+V pastes through Ghostty so the application receives the text directly.
keybind = performable:cmd+c=copy_to_clipboard:mixed
keybind = cmd+v=paste_from_clipboard
