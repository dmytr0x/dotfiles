# Herdr config docs: https://herdr.dev/docs/config-reference/
#
onboarding = false

[experimental]
kitty_graphics = true

[update]
version_check = false

[ui]
show_agent_labels_on_pane_borders = true
mouse_scroll_lines = 1

[ui.toast]
delivery = "herdr"
delay_seconds = 0

[ui.toast.herdr]
position = "top-right"

[theme]
name = "catppuccin"
auto_switch = false
dark_name = "catppuccin"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [
    { token = "$diff_added", fg = "#a6e3a1" },
    { token = "$diff_deleted", fg = "#f38ba8" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  [{ token = "agent", fg = "#ffd700", bold = false }, "state_text"],
  ["tab"],
]

[keys]
# open_worktree = "prefix+..."
zoom = "shift+esc"

# indexed jumps
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

[worktrees]
directory = "~/.worktrees"

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
[[keys.command]]
description = "Open shell"
key = "prefix+;"
type = "popup"
command = "zsh"
width = "90%"
height = "90%"

[[keys.command]]
description = "Open Hunk diff"
key = "prefix+d"
type = "shell"
command = '''
layout="$("$HERDR_BIN_PATH" pane layout --pane "$HERDR_ACTIVE_PANE_ID")" &&
direction="$(printf '%s\n' "$layout" | jq -er --arg pane "$HERDR_ACTIVE_PANE_ID" '.result.layout.panes[] | select(.pane_id == $pane) | if .rect.width >= (.rect.height * 2) then "right" else "down" end')" &&
pane_id="$("$HERDR_BIN_PATH" pane split "$HERDR_ACTIVE_PANE_ID" --direction "$direction" --focus | jq -er '.result.pane.pane_id')" &&
"$HERDR_BIN_PATH" pane run "$pane_id" "exec hunk diff --agent-notes --watch HEAD"
'''

[[keys.command]]
description = "Open editor"
key = "prefix+e"
type = "shell"
command = '''
pane_id="$("$HERDR_BIN_PATH" pane split "$HERDR_ACTIVE_PANE_ID" --direction right --focus | jq -er '.result.pane.pane_id')" &&
"$HERDR_BIN_PATH" pane run "$pane_id" 'exec "${EDITOR}"'
'''

[[keys.command]]
description = "Pane to tab"
key = "prefix+m"
type = "shell"
command = '''
"$HERDR_BIN_PATH" pane zoom "$HERDR_ACTIVE_PANE_ID" \
  --off >/dev/null 2>&1

"$HERDR_BIN_PATH" pane move "$HERDR_ACTIVE_PANE_ID" \
  --new-tab \
  --workspace "$HERDR_ACTIVE_WORKSPACE_ID" \
  --focus >/dev/null
'''

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "dmytr0x.herdr-task-picker.open"
description = "Picker"
