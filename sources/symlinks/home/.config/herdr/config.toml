# Herdr config docs: https://herdr.dev/docs/config-reference/
# 
onboarding = false

[update]
version_check = false

[ui]
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
delay_seconds = 3

[ui.toast.herdr]
position = "bottom-right"

[theme]
name = "catppuccin"
auto_switch = false
dark_name = "catppuccin"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  [{ token = "agent", fg = "#89b4fa", bold = true }, "state_text"],
  ["tab"],
]

[keys]
open_worktree = "prefix+space"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[worktrees]
directory = "~/.worktrees"

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
[[keys.command]]
description = "Open shell"
key = "prefix+alt+;"
type = "popup"
command = "zsh"
width = "90%"
height = "90%"

[[keys.command]]
description = "Open LazyGit"
key = "prefix+alt+l"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
description = "Open Zed Editor"
key = "prefix+alt+e"
type = "shell"
command = "zed --existing ."

[[keys.command]]
description = "Open Fork"
key = "prefix+alt+f"
type = "shell"
command = "fork"
