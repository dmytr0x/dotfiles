# Herdr config docs: https://herdr.dev/docs/config-reference/
#
onboarding = false

[experimental]
kitty_graphics = true

[update]
version_check = false

[ui]
show_agent_labels_on_pane_borders = true
mouse_scroll_lines = 1

agent_panel_sort = "spaces"
[ui.toast]
delivery = "herdr"
delay_seconds = 0

[ui.toast.herdr]
position = "top-right"

[theme]
name = "catppuccin"
auto_switch = false
dark_name = "catppuccin"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", fg = "#409ebb" }],
  [{ token = "$git_head", fg = "#b2beff" }, "git_status", { token = "$pr", fg = "#cba6f7" }],
  [
    { token = "$git_modified", fg = "#f9e2af" },
    { token = "$git_staged", fg = "#a6e3a1" },
    { token = "$git_untracked", fg = "#89b4fa" },
    { token = "$git_conflicts", fg = "#f38ba8" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  [{ token = "agent", fg = "#ffd700", bold = false }, "state_text"],
  ["tab"],
  ["pane"],
]

[keys]
# open_worktree = "prefix+..."
zoom = "shift+esc"

# indexed jumps
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

[worktrees]
directory = "~/.worktrees"

# ==== Keys ====

## Swap with a neighbor (built-in)
# ┌────────────┬────────────────┐
# │ Action     │ Key            │
# ├────────────┼────────────────┤
# │ Swap left  │ prefix+shift+h │
# ├────────────┼────────────────┤
# │ Swap down  │ prefix+shift+j │
# ├────────────┼────────────────┤
# │ Swap up    │ prefix+shift+k │
# ├────────────┼────────────────┤
# │ Swap right │ prefix+shift+l │
# └────────────┴────────────────┘


# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
[[keys.command]]
description = "Open shell"
key = "prefix+;"
type = "popup"
command = "zsh"
width = "90%"
height = "90%"

[[keys.command]]
description = "Open editor"
key = "prefix+shift+e"
type = "shell"
command = '''
worktree="$(git -C "${HERDR_ACTIVE_PANE_CWD:-$PWD}" rev-parse --show-toplevel)" &&
layout="$("$HERDR_BIN_PATH" pane layout --pane "$HERDR_ACTIVE_PANE_ID")" &&
direction="$(printf '%s\n' "$layout" | jq -er --arg pane "$HERDR_ACTIVE_PANE_ID" '.result.layout.panes[] | select(.pane_id == $pane) | if .rect.width >= (.rect.height * 2) then "right" else "down" end')" &&
pane_id="$("$HERDR_BIN_PATH" pane split "$HERDR_ACTIVE_PANE_ID" --direction "$direction" --cwd "$worktree" --focus | jq -er '.result.pane.pane_id')" &&
"$HERDR_BIN_PATH" pane run "$pane_id" 'exec nvim'
'''

[[keys.command]]
description = "Open LazyGit status"
key = "prefix+shift+s"
type = "shell"
command = '''
worktree="$(git -C "${HERDR_ACTIVE_PANE_CWD:-$PWD}" rev-parse --show-toplevel)" &&
pane_id="$("$HERDR_BIN_PATH" pane split "$HERDR_ACTIVE_PANE_ID" --direction right --cwd "$worktree" --focus | jq -er '.result.pane.pane_id')" &&
"$HERDR_BIN_PATH" pane run "$pane_id" 'exec lazygit status --screen-mode half'
'''

[[keys.command]]
description = "Open Yazi"
key = "prefix+shift+y"
type = "shell"
command = '''
worktree="$(git -C "${HERDR_ACTIVE_PANE_CWD:-$PWD}" rev-parse --show-toplevel)" &&
pane_id="$("$HERDR_BIN_PATH" pane split "$HERDR_ACTIVE_PANE_ID" --direction right --cwd "$worktree" --focus | jq -er '.result.pane.pane_id')" &&
"$HERDR_BIN_PATH" pane run "$pane_id" 'exec yazi'
'''

[[keys.command]]
description = "Open task picker"
key = "prefix+space"
type = "plugin_action"
command = "dmytr0x.herdr-task-picker.open"

[[keys.command]]
description = "Pane to tab"
key = "prefix+shift+m"
type = "shell"
command = '''
"$HERDR_BIN_PATH" pane zoom "$HERDR_ACTIVE_PANE_ID" \
  --off >/dev/null 2>&1

"$HERDR_BIN_PATH" pane move "$HERDR_ACTIVE_PANE_ID" \
  --new-tab \
  --workspace "$HERDR_ACTIVE_WORKSPACE_ID" \
  --focus >/dev/null
'''
