# Herdr config docs: https://herdr.dev/docs/config-reference/
#
onboarding = false

[experimental]
kitty_graphics = true

[update]
version_check = false

[ui]
show_agent_labels_on_pane_borders = true
mouse_scroll_lines = 1

[ui.toast]
delivery = "herdr"
delay_seconds = 0

[ui.toast.herdr]
position = "top-right"

[theme]
name = "catppuccin"
auto_switch = false
dark_name = "catppuccin"

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [
    { token = "$diff_added", fg = "#a6e3a1" },
    { token = "$diff_deleted", fg = "#f38ba8" },
  ],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  [{ token = "agent", fg = "#ffd700", bold = false }, "state_text"],
  ["tab"],
]

[keys]
# open_worktree = "prefix+..."
zoom = "shift+esc"

# indexed jumps
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

[worktrees]
directory = "~/.worktrees"

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# type = "popup" opens a session-modal terminal without changing the tab layout.
[[keys.command]]
description = "Open shell"
key = "prefix+;"
type = "popup"
command = "zsh"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "dmytr0x.herdr-task-picker.open"
description = "Picker"
