schema_version = 1

[runtime]
max_concurrency = 4
discovery_interval_ms = 5000

# Optional session-specific overrides; normally omitted.
# [workspace_dirs]
# w1 = "/absolute/path/to/project"

[[collectors]]
name = "git"
provider = "git"
interval_ms = 10000
timeout_ms = 1000
ttl_ms = 30000

# Prefix/suffix are literal text; the shorthand git_modified = "modified_files"
# still works. Colors belong in Herdr's config: see examples/herdr-sidebar.toml.
[collectors.tokens]
git_modified = { field = "modified_files", prefix = "!", show_zero = false }
git_staged = { field = "staged_files", prefix = "✓", show_zero = false }
git_untracked = { field = "untracked_files", prefix = "?", show_zero = false }
git_conflicts = { field = "conflict_files", prefix = "✖", show_zero = false }
# Example with both: { field = "modified_files", prefix = "[!", suffix = "]" }

[[collectors]]
name = "git-head"
provider = "command"
command = [
  "sh",
  "-c",
  '''
  GIT="git --no-optional-locks -c core.fsmonitor=false -c color.ui=false"
  inside=$($GIT rev-parse --is-inside-work-tree 2>/dev/null) || inside=
  if [ "$inside" != true ]; then
    exit 0
  fi
  branch=$($GIT symbolic-ref --short -q HEAD 2>/dev/null) || branch=
  if [ -n "$branch" ]; then
    printf '%s\n' "$branch"
    exit 0
  fi
  sha=$($GIT rev-parse --short HEAD 2>/dev/null) || sha=
  if [ -n "$sha" ]; then
    printf 'detached:%s\n' "$sha"
  fi
  ''',
]
output = "text"
interval_ms = 60000
timeout_ms = 1000
ttl_ms = 180000
[collectors.env]
GIT_TERMINAL_PROMPT = "0"
LC_ALL = "C"
[collectors.tokens]
git_head = "stdout"



