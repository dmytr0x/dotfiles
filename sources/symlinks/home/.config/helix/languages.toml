# Bash
[[language]]
name = "bash"
indent = { tab-width = 2, unit = "  " }
formatter = { command = 'shfmt', args = ["-i", "2", "-bn", "-ci"] }
auto-format = true

# Yaml
[[language]]
name = "yaml"
file-types = ["yaml", "yml"]
language-servers = ["yaml-language-server"]
formatter = { command = "yamlfmt", args = ["-"] }
auto-format = false

[language-server.yaml-language-server.yaml]
format = { enable = true }
validation = true

# Json
[[language]]
name = "json"
file-types = ["json", "jsonc"]
language-servers = ["vscode-json-language-server"]
indent = { tab-width = 4, unit = " " }
comment-token = "//"
auto-format = false

# Css
[[language]]
name = 'css'
language-servers = ['vscode-css-language-server']

# Html
[[language]]
name = 'html'
language-servers = ['vscode-html-language-server']

# Toml
[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }

# Lua
[[language]]
name = "lua"
auto-format = true

# Python
[[language]]
name = "python"
# Organize imports before formatting; resolve project config using the buffer path.
formatter = { command = "zsh", args = ["-o", "pipefail", "-c", "ruff check --silent --select I --fix-only --stdin-filename \"$1\" - | ruff format --stdin-filename \"$1\" -", "helix-ruff", "%{buffer_name}"] }
auto-format = false
roots = ["pyproject.toml", "ty.toml", "setup.py", "poetry.lock", ".git"]
language-servers = ["ty", "ruff"]

[language-server.ty]
command = "ty"
args = ["server"]

# Static LSP initialization option; allow ty to discover uv projects and scripts.
# Only open trusted workspaces with uv integration enabled.
[language-server.ty.config.experimental]
useUv = "on"

# ty requests ordinary editor settings via workspace/configuration, section "ty".
[language-server.ty.config.ty]
diagnosticMode = "openFilesOnly"
showSyntaxErrors = true

[language-server.ty.config.ty.inlayHints]
variableTypes = true
callArgumentNames = true

[language-server.ty.config.ty.completions]
autoImport = true
completeFunctionParentheses = true

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ruff.config.settings]
configurationPreference = "filesystemFirst"
showSyntaxErrors = false

# Rust
[[language]]
name = "rust"
auto-format = true

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config]
check = { command = "clippy", features = "all" }
diagnostics = { experimental = { enable = true } }
hover = { actions = { enable = true } }
typing = { autoClosingAngleBrackets = { enable = true } }
cargo = { allFeatures = true }
procMacro = { enable = true }

# Go
[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
