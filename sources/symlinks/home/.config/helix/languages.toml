# Bash
[[language]]
name = "bash"
indent = { tab-width = 2, unit = "  " }
formatter = { command = 'shfmt', args = ["-i", "2", "-bn", "-ci"] }
auto-format = true

# Yaml
[[language]]
name = "yaml"
file-types = ["yaml", "yml"]
language-servers = ["yaml-language-server"]
formatter = { command = "yamlfmt", args = ["-"] }
auto-format = false

[language-server.yaml-language-server.yaml]
format = { enable = true }
validation = true

# Json
[[language]]
name = "json"
file-types = ["json", "jsonc"]
language-servers = ["vscode-json-language-server"]
indent = { tab-width = 4, unit = " " }
comment-token = "//"
auto-format = false

# Css
[[language]]
name = 'css'
language-servers = ['vscode-css-language-server']

# Html
[[language]]
name = 'html'
language-servers = ['vscode-html-language-server']

# Toml
[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }

# Lua
[[language]]
name = "lua"
auto-format = true

# Python
[[language]]
name = "python"
# format the code + organize imports
formatter = { command = "sh", args = ["-c", "ruff format - | ruff check --select I --fix -"] }
auto-format = true
roots = ["pyproject.toml", "ty.toml", "setup.py", "poetry.lock", ".git"]
language-servers = ["ty", "ruff"]

[language-server.ty]
command = "ty"
args = ["server"]

# Helix 25.07 serializes `language-server.ty.config` verbatim as the LSP
# `initializationOptions` object. Ty expects `diagnosticMode`, `inlayHints`,
# and the other settings at that object's top level. Adding `.ty` after
# `.config` would instead send an unrecognized `{ "ty": { ... } }` wrapper.
# Helix: https://docs.helix-editor.com/languages.html#language-server-configuration
# Ty: https://docs.astral.sh/ty/reference/editor-settings/
[language-server.ty.config]
diagnosticMode = "openFilesOnly"
showSyntaxErrors = true

[language-server.ty.config.inlayHints]
variableTypes = true
callArgumentNames = true

[language-server.ty.config.completions]
autoImport = true
completeFunctionParentheses = true

[language-server.ruff]
command = "ruff"
args = ["server"]

# TODO: check how it works
[language-server.ruff.config.settings]
configurationPreference = "filesystemFirst"

[language-server.ruff.config.settings.format]
preview = false

[language-server.ruff.config.settings.lint]
preview = false

# Rust
[[language]]
name = "rust"
auto-format = true

[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config]
check = { command = "clippy", features = "all" }
diagnostics = { experimental = { enable = true } }
hover = { actions = { enable = true } }
typing = { autoClosingAngleBrackets = { enable = true } }
cargo = { allFeatures = true }
procMacro = { enable = true }

# Go
[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
